<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shopping Bag / Store Front Handle -->
  <path d="M176 180 C176 120, 210 80, 256 80 C302 80, 336 120, 336 180" 
        fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />

  <!-- Shopping Bag Body -->
  <path d="M120 180 L392 180 L424 432 C424 448, 408 460, 392 460 L120 460 C104 460, 88 448, 88 432 Z" 
        fill="none" stroke="#ffffff" stroke-width="32" stroke-linejoin="round" />

  <!-- POS Success Badge -->
  <circle cx="370" cy="370" r="75" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="12" />
  <path d="M340 370 L362 392 L402 350" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
</svg>
